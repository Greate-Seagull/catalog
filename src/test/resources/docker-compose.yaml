services:
  postgres:
    image: postgres:18-bookworm
    container_name: database
    hostname: database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - database-data:/var/lib/postgresql # version 18 requires the directory of /var/lib/postgresql instead of /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}" ]
      interval: 10s
      retries: 5

volumes:
  database-data: